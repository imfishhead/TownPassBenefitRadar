name: good-morning

x-k6-common: &k6-common
  image: grafana/k6:2.3.0
  profiles: [performance]
  working_dir: /scripts
  user: "0:0"
  volumes:
    - ./performance/k6:/scripts:ro
    - ./performance/results:/results

x-k6-environment: &k6-environment
  WARMUP_DURATION: ${K6_WARMUP_DURATION:-30s}
  NORMAL_DURATION: ${K6_NORMAL_DURATION:-1m}
  PEAK_DURATION: ${K6_PEAK_DURATION:-2m}
  COOLDOWN_DURATION: ${K6_COOLDOWN_DURATION:-30s}
  READ_WARMUP_VUS: ${K6_READ_WARMUP_VUS:-5}
  READ_NORMAL_VUS: ${K6_READ_NORMAL_VUS:-20}
  READ_PEAK_VUS: ${K6_READ_PEAK_VUS:-50}
  READ_COOLDOWN_VUS: ${K6_READ_COOLDOWN_VUS:-0}
  WRITE_WARMUP_VUS: ${K6_WRITE_WARMUP_VUS:-1}
  WRITE_NORMAL_VUS: ${K6_WRITE_NORMAL_VUS:-4}
  WRITE_PEAK_VUS: ${K6_WRITE_PEAK_VUS:-10}
  WRITE_COOLDOWN_VUS: ${K6_WRITE_COOLDOWN_VUS:-0}
  READ_P95_MS: ${K6_READ_P95_MS:-500}
  WRITE_P95_MS: ${K6_WRITE_P95_MS:-2000}
  MAX_FAILURE_RATE: ${K6_MAX_FAILURE_RATE:-0.01}
  MIN_CHECK_RATE: ${K6_MIN_CHECK_RATE:-0.99}
  ITERATION_SLEEP_SECONDS: ${K6_ITERATION_SLEEP_SECONDS:-1}
  K6_USER_A: ${K6_USER_A:-user-a}
  K6_USER_B: ${K6_USER_B:-user-b}

services:
  api:
    build:
      context: .
      target: dev
    working_dir: /workspace
    command: ["mvn", "spring-boot:run"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-good_morning}?sessionVariables=time_zone='+00:00'
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-good_morning}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-good_morning}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_URL: ${SPRING_FLYWAY_URL:-jdbc:mariadb://mariadb:3306/${DB_NAME:-good_morning}?sessionVariables=time_zone='+00:00'}
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:-${DB_USERNAME:-good_morning}}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:-${DB_PASSWORD:-good_morning}}
      MANAGEMENT_SERVER_PORT: 8081
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-good-morning-local}
      PRESIGNED_URL_TTL: ${PRESIGNED_URL_TTL:-PT15M}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${MANAGEMENT_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8081;
          printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3;
          grep -q '\"status\":\"UP\"' <&3"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      mariadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  loki:
    image: grafana/loki:3.7.0
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}}
      GF_SERVER_PROTOCOL: http
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-good_morning}
      MARIADB_USER: ${DB_USERNAME:-good_morning}
      MARIADB_PASSWORD: ${DB_PASSWORD:-good_morning}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-good_morning_root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 本機 S3：MinIO。官方 minio/minio 映像檔已從 Docker Hub 下架，這裡用社群 fork pgsty/minio
  # （指令、環境變數、資料格式與上游相同，內含 mc 與 curl）。根目錄的 docker-compose.yml（EC2 版）也用同一個映像檔與 init 腳本。
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      # 與後端 AWS_REGION 一致，否則 SigV4 簽章的 region 會被拒絕
      MINIO_REGION: ${AWS_REGION:-ap-southeast-2}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 一次性：建立 bucket（已存在就略過），完成後 api 才啟動
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["bash", "/init/init-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-good-morning-local}
    volumes:
      - ./docker/minio:/init:ro
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  k6-local:
    <<: *k6-common
    environment:
      <<: *k6-environment
      BASE_URL: ${K6_LOCAL_BASE_URL:-http://api:8080/api}
    command: ["run", "--include-system-env-vars", "/scripts/local.js"]
    depends_on:
      api:
        condition: service_healthy

  k6-aws:
    <<: *k6-common
    environment:
      <<: *k6-environment
      BASE_URL: ${BASE_URL:-}
    command: ["run", "--include-system-env-vars", "/scripts/aws.js"]

volumes:
  mariadb-data:
  minio-data:
  maven-cache:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
