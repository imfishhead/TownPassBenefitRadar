name: good-morning

services:
  # ==============================
  # 前端服務 (Vue)
  # ==============================
  frontend:
    build:
      context: ./GoodMorning
      dockerfile: Dockerfile
      args:
        - VITE_API_MODE=http
    container_name: vue-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8080
      - GRAFANA_URL=http://grafana:3000
      # 圖片的簽名網址指向公開網址的 /<bucket>/...，由這個 Nginx 轉給 MinIO（只放行 GET/HEAD）
      - S3_URL=http://minio:9000
      - S3_BUCKET=${AWS_S3_BUCKET:-taipei-code-fest-assets}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  # ==============================
  # 後端服務 (Spring Boot) - 融合隊友的 dev/runtime 架構與 8080/8081 分離
  # ==============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spring-backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-demo}
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/${DB_NAME:-good_morning}?sessionVariables=time_zone='+00:00'
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-good_morning}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-good_morning}
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_URL=jdbc:mariadb://mariadb:3306/${DB_NAME:-good_morning}?sessionVariables=time_zone='+00:00'
      - SPRING_FLYWAY_USER=${DB_USERNAME:-good_morning}
      - SPRING_FLYWAY_PASSWORD=${DB_PASSWORD:-good_morning}
      # 【關鍵】將 Actuator 管理埠獨立到 8081，API 維持 8080
      - SERVER_PORT=8080
      - MANAGEMENT_SERVER_PORT=8081
      - MANAGEMENT_SERVER_ADDRESS=0.0.0.0
      # 物件儲存：自架 MinIO（S3 相容），與 backend 在同一個 Compose 網路
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-taipei-code-fest-assets}
      - PRESIGNED_URL_TTL=${PRESIGNED_URL_TTL:-PT15M}
      # 這組金鑰同時是 MinIO 的 root 帳密（沿用 AWS_* 變數名稱，AWS SDK 才讀得到）。必填、MinIO 要求密碼至少 8 字元。
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?請在 .env 設定 AWS_ACCESS_KEY_ID（MinIO 帳號）}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?請在 .env 設定 AWS_SECRET_ACCESS_KEY（MinIO 密碼，至少 8 字元）}
      # 設了 S3_ENDPOINT 後端就改用 MinIO（path-style）；S3_PUBLIC_ENDPOINT 是瀏覽器開圖片用的公開網址（ALB 網址，同網域，結尾不要斜線）
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    networks:
      default:
        aliases:
          - api
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8081;
          printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3;
          grep -q '\"status\":\"UP\"' <&3"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      mariadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ==============================
  # 物件儲存 (MinIO，S3 相容)：取代 AWS S3
  # 官方 minio/minio 映像檔已從 Docker Hub 下架，這裡用社群 fork pgsty/minio
  # （指令、環境變數、資料格式與上游相同，內含 mc 與 curl）。
  # 不對外開 9000：瀏覽器經 frontend Nginx 的 /<bucket>/ 取圖；管理 console 只綁 EC2 loopback。
  # ==============================
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?請在 .env 設定 AWS_ACCESS_KEY_ID（MinIO 帳號）}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?請在 .env 設定 AWS_SECRET_ACCESS_KEY（MinIO 密碼，至少 8 字元）}
      # 與後端 AWS_REGION 一致，否則 SigV4 簽章的 region 會被拒絕
      MINIO_REGION: ${AWS_REGION:-ap-southeast-2}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  # 一次性：建立 bucket（已存在就略過），完成後 backend 才啟動。背景與徽章圖要另外放進 bucket（見 runbook）。
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio-init
    entrypoint: ["bash", "/init/init-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?請在 .env 設定 AWS_ACCESS_KEY_ID（MinIO 帳號）}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?請在 .env 設定 AWS_SECRET_ACCESS_KEY（MinIO 密碼，至少 8 字元）}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-taipei-code-fest-assets}
    volumes:
      - ./backend/docker/minio:/init:ro
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  # ==============================
  # 資料庫服務 (MariaDB) - 採用隊友的 11.4 版本
  # ==============================
  mariadb:
    image: mariadb:11.4
    container_name: mariadb-db
    environment:
      MARIADB_DATABASE: ${DB_NAME:-good_morning}
      MARIADB_USER: ${DB_USERNAME:-good_morning}
      MARIADB_PASSWORD: ${DB_PASSWORD:-good_morning}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-good_morning_root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  # ==============================
  # 監控服務：Prometheus
  # ==============================
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  # ==============================
  # Log 儲存：Loki
  # ==============================
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./backend/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: always

  # ==============================
  # Log 收集：Grafana Alloy
  # ==============================
  alloy:
    image: grafana/alloy:v1.21.0
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./backend/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: always

  # ==============================
  # 監控服務：Grafana
  # ==============================
  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./backend/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

volumes:
  mariadb-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
